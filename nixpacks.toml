[variables]
COMPOSER_ALLOW_SUPERUSER = "1"

[phases.setup]
nixPkgs = [
    "php82",
    "php82Packages.composer",
    "php82Extensions.pdo",
    "php82Extensions.pdo_mysql",
    "php82Extensions.mbstring",
    "php82Extensions.tokenizer",
    "php82Extensions.xml",
    "php82Extensions.ctype",
    "php82Extensions.fileinfo",
    "php82Extensions.curl",
    "php82Extensions.zip",
    "php82Extensions.gd",
    "php82Extensions.intl",
    "php82Extensions.bcmath",
    "php82Extensions.redis",
    "php82Extensions.pcntl",
    "php82Extensions.posix",
    "nodejs_20",
    "nodePackages.npm"
]

[phases.install]
cmds = [
    "mkdir -p storage/framework/sessions storage/framework/views storage/framework/cache/data storage/logs bootstrap/cache",
    "chmod -R 777 storage bootstrap/cache || true",
    "composer install --no-dev --optimize-autoloader --no-interaction --ignore-platform-req=ext-pcntl --ignore-platform-req=ext-posix",
    "npm ci || npm install",
    "npm run build"
]

[phases.build]
cmds = [
    "php artisan storage:link || true"
]

[start]
cmd = "php artisan migrate --force && php artisan serve --host=0.0.0.0 --port=$PORT"
